<main id="surface" aria-label="Magic 视界桌面收纳">
  <header><div><span class="eyebrow">MAGIC COMMUNITY</span><h1>我的桌面</h1><p id="screen">正在连接…</p></div><span id="version" class="badge">桌面体验</span></header>
  <nav><button id="refresh">刷新</button><button id="settings">设置 / 整理</button><button id="feedback">记录问题</button><button id="exit">退出桌面</button></nav>
  <p id="status" role="status">正在读取本地收纳布局…</p>
  <section id="boxes" aria-label="收纳盒"></section>
  <details id="available" open><summary>桌面可用项目 <span id="count"></span></summary><p class="hint">单击选择，再加入收纳盒；双击打开。也可拖到收纳盒。</p><div id="library" class="tiles"></div></details>
  <footer>文件只保存引用 · 原生图标保留 · 可随时返回 Windows</footer>
</main>
